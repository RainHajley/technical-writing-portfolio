name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build HTML from AsciiDoc
        uses: docker://asciidoctor/docker-asciidoctor:latest
        with:
          args: "asciidoctor --directory=asciidoc-samples --destination-dir=../docs asciidoc-samples/sensitive-data-sop.adoc"

      - name: Complete Build Notification
        run: echo "Documentation successfully generated and ready for Pages deployment."
