name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build HTML from AsciiDoc
        run: |
          docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest sh -c "asciidoctor --directory=asciidoc-samples --destination-dir=docs asciidoc-samples/sensitive-data-sop.adoc"
