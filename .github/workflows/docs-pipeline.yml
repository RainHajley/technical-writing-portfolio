name: Generate and Deploy Documentation Website
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Fixed compilation path mapping
      - name: Build HTML from AsciiDoc
        run: |
          docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor --destination-dir=docs asciidoc-samples/sensitive-data-sop.adoc

      # Saves the file to your repository
      - name: Deploy to GitHub Pages Folder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/
          git commit -m "Automated CI/CD: Rendered AsciiDoc to HTML" || exit 0
          git push
