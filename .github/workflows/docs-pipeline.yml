name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Sync and Clean Workspace
      - name: Sync and Clean Workspace
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main

      # 1. Build HTML from AsciiDoc (Preserving Structure)
      - name: Build HTML from AsciiDoc
        run: |
          mkdir -p docs
          # Compile README.adoc to index.html in the root of docs/
          if [ -f README.adoc ]; then
            docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor -o docs/index.html README.adoc
          fi
          # Compile other .adoc files while maintaining their folder paths
          find . -name "*.adoc" -not -name "README.adoc" -not -path "./docs/*" -not -path "./.git/*" | while read file; do
            # Remove leading './' from path
            clean_path=${file#./}
            # Create the corresponding directory in docs/
            target_dir="docs/$(dirname "$clean_path")"
            mkdir -p "$target_dir"
            # Build the file to that directory
            docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor -D "$target_dir" "$file"
          done

      # 2. Build HTML from Markdown (Preserving Structure)
      - name: Build HTML from Markdown
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          find . -name "*.md" -not -path "./docs/*" -not -path "./.git/*" | while read file; do
            clean_path=${file#./}
            target_dir="docs/$(dirname "$clean_path")"
            mkdir -p "$target_dir"
            pandoc "$file" -s -o "$target_dir/$(basename "${file%.md}.html")"
          done

      # 3. Deploy
      - name: Deploy to GitHub Pages Folder
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Automated CI/CD: Pipeline rendered all .adoc and .md assets"
            git push origin main
          else
            echo "No changes to deploy."
          fi
