name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Compile AsciiDoc
      - name: Build HTML from AsciiDoc
        run: |
          docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor --destination-dir=docs asciidoc-samples/sensitive-data-sop.adoc

      # 2. Compile All Markdown Documents
      - name: Build HTML from Markdown
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pandoc markdown-samples/markdown-formatting-guide.md -s -o docs/markdown-formatting-guide.html --metadata title="Markdown Formatting Guide"
          if [ -f markdown-samples/grammarly-guide.md ]; then
            pandoc markdown-samples/grammarly-guide.md -s -o docs/grammarly-guide.html --metadata title="Grammarly Integration Guide"
          fi
          if [ -f api-samples/llm-generation-api.md ]; then
            pandoc api-samples/llm-generation-api.md -s -o docs/api-reference.html --metadata title="Nexus AI Chat Completions API Reference"
          fi

      # 3. Saves everything safely to your live portfolio folder
      - name: Deploy to GitHub Pages Folder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # Sync with remote BEFORE committing to prevent push conflicts
          git pull --rebase origin main
          git add docs/
          git commit -m "Automated CI/CD: Rendered all pipeline assets to HTML" || exit 0
          git push origin main
