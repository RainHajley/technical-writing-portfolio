name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Sync and Clean Workspace
      - name: Sync and Clean Workspace
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main

      # 1. Compile ALL AsciiDoc files automatically
      - name: Build HTML from AsciiDoc
        run: |
          mkdir -p docs
          # Compile README.adoc specifically to index.html
          if [ -f README.adoc ]; then
            docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor -o docs/index.html README.adoc
          fi
          # Compile all OTHER .adoc files normally
          docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest bash -c "find . -name '*.adoc' -not -name 'README.adoc' -not -path './docs/*' -exec asciidoctor -D docs {} \;"

      # 2. Compile ALL Markdown files automatically
      - name: Build HTML from Markdown
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          mkdir -p docs
          for file in $(find . -name '*.md' -not -path './docs/*'); do
            pandoc "$file" -s -o "docs/$(basename "${file%.md}.html")"
          done

      # 3. Deploy
      - name: Deploy to GitHub Pages Folder
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Automated CI/CD: Pipeline rendered all .adoc and .md assets"
            git push origin main
          else
            echo "No changes to deploy."
          fi
