name: Generate and Deploy Documentation Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Sync and Clean Workspace
      - name: Sync and Clean Workspace
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main

      # 1. Compile AsciiDoc
      - name: Build HTML from AsciiDoc
        run: |
          docker run --rm -v ${{ github.workspace }}:/documents asciidoctor/docker-asciidoctor:latest asciidoctor --destination-dir=docs asciidoc-samples/sensitive-data-sop.adoc

      # 2. Compile All Markdown Documents
      - name: Build HTML from Markdown
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          # Standard guides
          pandoc markdown-samples/markdown-formatting-guide.md -s -o docs/markdown-formatting-guide.html --metadata title="Markdown Formatting Guide"
          
          # Documentation standards
          if [ -f engineering_docs_standards.md ]; then
            pandoc engineering_docs_standards.md -s -o docs/engineering-standards.html --metadata title="Engineering Documentation Standards"
          fi
          
          # API Reference (Updated filename reference)
          if [ -f chat_completions_api.md ]; then
            pandoc chat_completions_api.md -s -o docs/api-reference.html --metadata title="Nexus AI Chat Completions API Reference"
          fi
          
          # SOP Reference
          if [ -f sop_patient_data.md ]; then
            pandoc sop_patient_data.md -s -o docs/sop-patient-data.html --metadata title="SOP: Patient Data Sanitization"
          fi

      # 3. Deploy
      - name: Deploy to GitHub Pages Folder
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Automated CI/CD: Rendered all pipeline assets to HTML"
            git push origin main
          else
            echo "No changes to deploy."
          fi
